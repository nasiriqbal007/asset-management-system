<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="assetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="empGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="400" cy="400" r="380" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <circle cx="400" cy="350" r="230" fill="none" stroke="#1e293b" stroke-width="6" />
  <circle cx="400" cy="350" r="230" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="100 40 20 40 60 40" opacity="0.5" transform="rotate(25 400 350)" />
  
  <circle cx="630" cy="350" r="5" fill="#38bdf8" />
  <circle cx="170" cy="350" r="5" fill="#34d399" />

  <g stroke-width="6" opacity="0.8">
    <path d="M 400 350 L 270 270" stroke="url(#empGrad)" stroke-linecap="round" />
    <path d="M 400 350 L 530 270" stroke="url(#assetGrad)" stroke-linecap="round" />
    <path d="M 400 350 L 400 460" stroke="url(#coreGrad)" stroke-linecap="round" />
  </g>

  <g transform="translate(400, 460)" filter="url(#glow)">
    <path d="M -45 0 L -45 25 A 45 15 0 0 0 45 25 L 45 0 Z" fill="#1e40af" />
    <ellipse cx="0" cy="0" rx="45" ry="15" fill="#3b82f6" stroke="#93c5fd" stroke-width="2" />
    
    <path d="M -45 -20 L -45 5 A 45 15 0 0 0 45 5 L 45 -20 Z" fill="#1d4ed8" />
    <ellipse cx="0" cy="-20" rx="45" ry="15" fill="#1e4e8e" stroke="#60a5fa" stroke-width="2" />

    <path d="M -45 -40 L -45 -15 A 45 15 0 0 0 45 -15 L 45 -40 Z" fill="url(#coreGrad)" />
    <ellipse cx="0" cy="-40" rx="45" ry="15" fill="#60a5fa" stroke="#eff6ff" stroke-width="2" />
  </g>

  <g transform="translate(270, 270)">
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="url(#empGrad)" stroke-width="4" filter="url(#glow)"/>
    <circle cx="0" cy="-10" r="14" fill="url(#empGrad)" />
    <path d="M -24 20 A 24 24 0 0 1 24 20 Z" fill="url(#empGrad)" />
    <rect x="-10" y="9" width="20" height="5" fill="#ffffff" rx="1.5" opacity="0.8"/>
  </g>

  <g transform="translate(530, 270)">
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="url(#assetGrad)" stroke-width="4" filter="url(#glow)"/>
    <rect x="-24" y="-16" width="48" height="30" rx="4" fill="url(#assetGrad)" />
    <rect x="-19" y="-11" width="38" height="21" fill="#0f172a" />
    <path d="M -32 18 L 32 18 L 25 23 L -25 23 Z" fill="url(#assetGrad)" />
  </g>

  <circle cx="400" cy="350" r="20" fill="#1e293b" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 395 350 L 399 354 L 406 346" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <text x="400" y="615" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-size="32px" 
        font-weight="800" 
        letter-spacing="4px">
    EAMS
  </text>
  
  <text x="400" y="650" 
        text-anchor="middle" 
        fill="#94a3b8" 
        font-family="'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-size="13px" 
        font-weight="600" 
        letter-spacing="1.5px">
    EMPLOYEE ASSET MANAGEMENT SYSTEM
  </text>

  <g transform="translate(400, 680)">
    <rect x="-120" y="0" width="240" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="15" 
          text-anchor="middle" 
          fill="#38bdf8" 
          font-family="'Segoe UI', Roboto, Helvetica, sans-serif" 
          font-size="10px" 
          font-weight="700" 
          letter-spacing="0.5px">
      BACKEND ASSESSMENT PROJECT
    </text>
  </g>
</svg>
